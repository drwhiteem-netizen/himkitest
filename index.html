<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* СКРЫВАЕМ КАРТУ ПО УМОЛЧАНИЮ */
        #map {
            display: none;
        }
        /* СТИЛИ ДЛЯ ФОРМЫ ВХОДА */
        #login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-card input {
            padding: 10px;
            width: 200px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .login-card button {
            padding: 10px 20px;
            background-color: #0078ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-card button:hover {
            background-color: #0056b3;
        }
        </style>
        <title>Интерактивная карта. Химки-2026. [ЕМ]</title>
    </head>
    <body>
        <!-- ОФОРМЛЕННАЯ ФОРМА ВХОДА -->
        <div id="login-box">
            <div class="login-card">
                <h2>Доступ ограничен</h2>
                <p>Введите пароль для просмотра карты:</p>
                <input type="password" id="password" placeholder="Пароль" onkeypress="if(event.key === 'Enter') checkPassword()">
                <br>
                <button onclick="checkPassword()">Войти</button>
                <p id="error" style="color: red; margin-top: 10px; min-height: 20px;"></p>
            </div>
        </div>

        <!-- КАРТА С КЛАССАМИ QGIS (СКРЫТА СТАРТОВО) -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/_1.js"></script><script src="layers/_2.js"></script><script src="layers/_3.js"></script><script src="layers/_4.js"></script><script src="layers/_5.js"></script><script src="layers/_6.js"></script><script src="layers/_7.js"></script>
        <script src="styles/_1_style.js"></script><script src="styles/_2_style.js"></script><script src="styles/_3_style.js"></script><script src="styles/_4_style.js"></script><script src="styles/_5_style.js"></script><script src="styles/_6_style.js"></script><script src="styles/_7_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        

        <!-- СКРИПТ ПРОВЕРКИ ПАРОЛЯ -->
        <script>
            function checkPassword() {
                var input = document.getElementById("password").value;
                var correctPassword = "Milovatsky"; // УКАЖИТЕ ВАШ ПАРОЛЬ ТУТ

                if (input === correctPassword) {
                    // Прячем окно входа
                    document.getElementById("login-box").style.display = "none";
                    // Показываем карту
                    document.getElementById("map").style.display = "block";
                    // Принудительно обновляем размер карты OpenLayers, чтобы она не сдвигалась
                    if (typeof map !== 'undefined' && map.updateSize) {
                        map.updateSize();
                    }
                } else {
                    document.getElementById("error").innerText = "Неверный пароль!";
                }
            }
        </script>
    </body>
</html>
